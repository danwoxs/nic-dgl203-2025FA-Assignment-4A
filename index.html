<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap-CDN</title>
    <!-- link to Bootstrap files via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- link to Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
    <title>AuroraTours - Travel with us</title>
  </head>
  <body>
    <!-- link to BootStrap JS -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>

    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand text-uppercase" href="#">AuroraTours</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#">Packages</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">FAQ</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <section class="modal fade" tabindex="-1" id="booking-modal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Book a tour</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form action="#">
                <div class="row">
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <label for="exampleInputEmail1" class="form-label"
                        >Email address</label
                      >
                      <input
                        type="email"
                        class="form-control"
                        id="exampleInputEmail1"
                        placeholder="Your email"
                      />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <select name="" id="select1" class="form-select">
                        <option value="">Tromso, Norway - $899</option>
                        <option value="">Reykjavik, Iceland - $799</option>
                        <option value="">Yukon, Canada - $849</option>
                      </select>
                      <label for="select">Pick a tour</label>
                    </div>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" class="btn btn-primary">Checkout</button>
            </div>
          </div>
        </div>
      </section>

      <section id="carouselExample" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>

        <div class="carousel-inner">
          <div class="carousel-item active c-item">
            <img
              src="images/sami-matias-breilin-UZOpP-YHe9Q-unsplash.jpg"
              class="d-block w-100 c-img"
              alt="..."
            />
            <div class="carousel-caption top-0 mt-4">
              <p class="fs-3 mt-5 text-uppercase">Discover the hidden world</p>
              <h1 class="display-1 fw-bolder text-capitalize">
                The Aurora Tours
              </h1>
              <button
                class="btn btn-primary px-4 py-2 fs-5 mt-5"
                data-bs-toggle="modal"
                data-bs-target="#booking-modal"
              >
                Book a tour
              </button>
            </div>
          </div>
          <div class="carousel-item c-item">
            <img
              src="images/lightscape-LtnPejWDSAY-unsplash.jpg"
              class="d-block w-100 c-img"
              alt="..."
            />
            <div class="carousel-caption top-0 mt-4">
              <p class="fs-3 mt-5 text-uppercase">The season has arrived</p>
              <h1 class="display-1 fw-bolder text-capitalize">
                3 available tours
              </h1>
              <button
                class="btn btn-primary px-4 py-2 fs-5 mt-5"
                data-bs-toggle="modal"
                data-bs-target="#booking-modal"
              >
                Book a tour
              </button>
            </div>
          </div>
          <div class="carousel-item c-item">
            <img
              src="images/jonatan-pie-EvKBHBGgaUo-unsplash.jpg"
              class="d-block w-100 c-img"
              alt="..."
            />
            <div class="carousel-caption top-0 mt-4">
              <p class="fs-3 mt-5 text-uppercase">Destination activities</p>
              <h1 class="display-1 fw-bolder text-capitalize">
                Go glacier hiking
              </h1>
              <button
                class="btn btn-primary px-4 py-2 fs-5 mt-5"
                data-bs-toggle="modal"
                data-bs-target="#booking-modal"
              >
                Book a tour
              </button>
            </div>
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </section>

      <section class="overview">
        <div class="container h-100 d-flex align-items-center">
          <div class="row w-100 text-center fs-4">
            <div class="col-xl">
              <i class="bi bi-airplane-fill me-2"></i>
              3 amazing destinations
            </div>
            <div class="col-xl">
              <i class="bi bi-wallet-fill me-2"></i>
              Only pay 5% up front
            </div>
            <div class="col-xl">
              <i class="bi bi-patch-check-fill me-2"></i>
              1000's of customers
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
